name: Validate presentation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/check_site.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/workcell.test.mjs tests/soft-workcell.test.mjs
